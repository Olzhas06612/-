<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Аркада">
<meta name="description" content="Игровой автомат с друзьями: 6 мини-игр, рекорды и достижения">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Аркада друзей</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<main class="cab">
  <div class="marquee">АРКАДА<br>ДРУЗЕЙ</div>
  <div class="bezel"><div class="crt"><canvas id="s" width="240" height="320" aria-label="Экран игрового автомата"></canvas></div></div>
  <div class="panel">
    <div class="joy">
      <button class="arr" id="bl" aria-label="Влево">◀</button>
      <div class="stick" id="stick"></div>
      <button class="arr" id="br" aria-label="Вправо">▶</button>
    </div>
    <div class="btns">
      <div class="b"><button class="yel" id="bsel" aria-label="Назад"></button>Назад</div>
      <div class="b"><button class="red" id="bstart" aria-label="Старт"></button>Старт</div>
    </div>
  </div>
  <div class="strip"><button class="plate" id="bmus">Музыка: выкл</button><button class="plate" id="btop">Рекорды</button><button class="plate" id="bach">Успехи</button><button class="plate" id="bpause">Пауза</button><button class="plate" id="bshare">Поделиться</button></div>
</main>
<div class="modal" id="modal" hidden><div class="sheet"><h2>Мои друзья</h2><p>Нажми на кружок, чтобы загрузить фото друга. Фото хранится только в твоём браузере.</p><div id="list"></div><button class="plate" id="mclose">Готово</button></div></div>
</div>
<script src="game.js"></script>
</body>
</html>
